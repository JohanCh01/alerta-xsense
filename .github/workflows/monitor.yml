# Revisa las temperaturas de Xsense y publica la app con los datos nuevos.
# Corre solo cada 12 minutos (GitHub puede atrasarse algunos minutos),
# cuando se sube un cambio a la app, o a mano desde la pestaña "Actions".
name: Monitor Xsense

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar además una notificación de prueba a los celulares registrados"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/**", "monitor/**", ".github/workflows/monitor.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monitor-xsense
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor/requirements.txt

      - name: Instalar librerías
        run: pip install -r monitor/requirements.txt

      - name: Revisar temperaturas en Xsense
        id: revisar
        env:
          XSENSE_EMAIL: ${{ secrets.XSENSE_EMAIL }}
          XSENSE_PASSWORD: ${{ secrets.XSENSE_PASSWORD }}
        run: python monitor/xsense_monitor.py

      - name: Guardar diagnóstico si falló el login
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-login
          path: monitor/diagnostico_login.*
          if-no-files-found: ignore
          retention-days: 3

      - name: Preparar la publicación
        uses: actions/configure-pages@v5

      - name: Empaquetar la app con los datos
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Las alertas van después de publicar, para que la imagen del gráfico ya esté en línea
      - name: Enviar alertas al celular
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python monitor/notificar.py

      - name: Avisar que el monitor no pudo revisar Xsense
        if: failure() && steps.revisar.outcome == 'failure'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python monitor/notificar.py --error

      - name: Notificación de prueba
        if: github.event_name == 'workflow_dispatch' && inputs.prueba
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python monitor/notificar.py --prueba
